<div class="gallery" style="--count:$count;--interval:$interval">
  <nav class="gallery-controls" aria-label="$nav_label">
    <div class="gallery-controls-inner shell">
      <div class="swatches$swatch_style">$swatches</div>
      <a class="gallery-next" href="#$next_id">$next_label</a>
    </div>
  </nav>
  <div class="flavor-track">$steps</div>
</div>
